server.port=8080
spring.application.name=spring-observability-alerting-java

# 日志中通过 %X{requestId} 关联本次请求标识
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n

# ---- 指标维度基数上限（超限归并 __other__，非法归并 __invalid__）----
observability.metrics.max-endpoint-values=100
observability.metrics.max-status-values=16
observability.metrics.max-endpoint-length=128
observability.metrics.latency-buckets-millis=5,10,25,50,100,250,500,1000,2500

# ---- 请求标识 ----
observability.request-id.header-name=X-Request-Id

# ---- 告警（滑动窗口 + 冷却 + 空闲回收）----
observability.alert.enabled=true
observability.alert.tick-ms=1000
observability.alert.idle-grace-seconds=60
# 示例规则：/boom 在 60s 滑动窗口内异常量 >= 3 触发，冷却 30s
observability.alert.rules[0].id=boom-errors
observability.alert.rules[0].endpoint=/boom
observability.alert.rules[0].status=*
observability.alert.rules[0].metric=ERRORS
observability.alert.rules[0].window-seconds=60
observability.alert.rules[0].threshold=3
observability.alert.rules[0].cooldown-seconds=30
