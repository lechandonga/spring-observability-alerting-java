server.port=8080

# Request id in every log line
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-none}] %logger{36} - %msg%n

# Observability pipeline
observability.max-series=500
observability.idle-series-ttl=PT30M
observability.evaluation-interval=PT10S
observability.max-rules=100

# Sample alert rule: >=5 errors on GET /api/fail within 1 minute, 2 minute cooldown
observability.rules[0].name=fail-endpoint-errors
observability.rules[0].endpoint=GET /api/fail
observability.rules[0].status-class=5xx
observability.rules[0].threshold=5
observability.rules[0].window=PT1M
observability.rules[0].cooldown=PT2M
